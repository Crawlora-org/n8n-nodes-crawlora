name: Publish

# Publishes the package to npm with provenance when a v* tag is pushed.
# n8n's community-node verification (from 2026-05-01) requires provenance, which
# needs `id-token: write` + npm CLI >= 9.5 on a supported CI (GitHub Actions).
#
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
      - run: npm publish --provenance --access public --registry=https://registry.npmjs.org
      - name: Verify npm publication
        env:
          NPM_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 12); do
            published_version=$(npm view "${package_name}@${package_version}" version --registry="$NPM_REGISTRY" 2>/dev/null || true)
            latest_version=$(npm view "$package_name" dist-tags.latest --registry="$NPM_REGISTRY" 2>/dev/null || true)
            if [ "$published_version" = "$package_version" ] && [ "$latest_version" = "$package_version" ]; then
              echo "Verified $package_name@$package_version on $NPM_REGISTRY"
              exit 0
            fi
            echo "Waiting for $package_name@$package_version to appear on npm (attempt $attempt/12)"
            sleep 5
          done
          echo "npm publication verification failed for $package_name@$package_version" >&2
          echo "Published version: ${published_version:-<missing>}" >&2
          echo "latest dist-tag: ${latest_version:-<missing>}" >&2
          exit 1
